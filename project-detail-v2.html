<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Atlas — Book Close Q1 2025 · Bright &amp; Bloom · Project Detail</title>
<!--
  Project detail as shipped in the app (Projects → client → project):
    header actions  Documents (N need you) · Sync · Re-run enrichment · Review All Transactions · Complete Project
    Checklist       one "Bank statement for <account>" item per account, Received / Missing + upload
    Accounts        per-account card: status line, Ingested / Categorized, "Review N transactions →"
    right panel     Project period
  "Documents" opens the project's documents inbox (bookkeeping-documents.html).
-->
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --primary: #6366f1; --primary-dark: #4f46e5; --primary-darker: #4338ca;
  --slate-50:  #f8fafc; --slate-100: #f1f5f9; --slate-200: #e2e8f0;
  --slate-300: #cbd5e1; --slate-400: #94a3b8; --slate-500: #64748b;
  --slate-600: #475569; --slate-700: #334155; --slate-800: #1e293b; --slate-900: #0f172a;
  --green-50: #f0fdf4; --green-100: #dcfce7; --green-200: #bbf7d0; --green-500: #22c55e; --green-600: #16a34a; --green-700: #15803d;
  --amber-50: #fffbeb; --amber-100: #fef3c7; --amber-300: #fcd34d; --amber-400: #fbbf24; --amber-500: #f59e0b; --amber-700: #b45309; --amber-800: #92400e;
  --indigo-50: #eef2ff; --indigo-100: #e0e7ff; --indigo-200: #c7d2fe; --indigo-600: #4f46e5;
  --blue-50: #eff6ff; --blue-200: #bfdbfe; --blue-400: #60a5fa; --blue-500: #3b82f6; --blue-600: #2563eb;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 13px; background: var(--slate-50); color: var(--slate-900);
  display: flex; height: 100vh; overflow: hidden;
}

.main { flex: 1; overflow-y: auto; min-width: 0; }
.page { max-width: 1240px; margin: 0 auto; padding: 28px 32px 48px; display: flex; flex-direction: column; gap: 22px; }

/* ── Header row: breadcrumb + actions ── */
.head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.crumb { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--slate-400); }
.crumb a { color: var(--slate-400); text-decoration: none; }
.crumb a:hover { color: var(--primary-dark); }
.crumb .sep { color: var(--slate-300); }
.crumb .cur { color: var(--slate-800); font-weight: 600; }
.spacer { flex: 1; }
.btn { display: inline-flex; align-items: center; gap: 6px; font: inherit; font-size: 12.5px; font-weight: 600; padding: 8px 13px; border-radius: 9px; border: 1px solid var(--slate-200); background: white; color: var(--primary-dark); cursor: pointer; text-decoration: none; white-space: nowrap; }
.btn:hover { background: var(--slate-50); }
.btn.primary { background: var(--primary-dark); border-color: var(--primary-dark); color: white; padding: 9px 16px; font-size: 13px; }
.btn.primary:hover { background: var(--primary-darker); }
.btn.primary .badge { background: rgba(255,255,255,.22); border-radius: 999px; padding: 1px 8px; font-size: 11px; font-weight: 700; }
.btn.soft { background: var(--indigo-50); border-color: var(--indigo-100); }
.btn.soft:hover { background: var(--indigo-100); }
.btn.disabled { background: var(--slate-100); color: var(--slate-400); cursor: not-allowed; }
.btn.disabled:hover { background: var(--slate-100); }

/* ── Two columns ── */
.cols { display: flex; gap: 20px; align-items: flex-start; }
.main-col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 22px; }
.sec-hd { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; }
.sec-title { font-size: 14px; font-weight: 700; color: var(--slate-800); }
.sec-meta { font-size: 12px; color: var(--slate-400); }
.sec-meta.need { color: var(--amber-700); font-weight: 600; }

/* ── Checklist ── */
.checklist { background: white; border: 1px solid var(--slate-200); border-radius: 12px; overflow: hidden; }
.cl-top { padding: 14px 18px 12px; }
.cl-count { font-size: 12.5px; color: var(--slate-600); }
.cl-count b { color: var(--slate-900); }
.cl-bar { height: 6px; background: var(--slate-100); border-radius: 999px; overflow: hidden; margin-top: 9px; }
.cl-fill { height: 100%; background: var(--green-500); border-radius: 999px; }
.cl-row { display: flex; align-items: center; gap: 12px; padding: 12px 18px; border-top: 1px solid var(--slate-100); }
.cl-check { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.cl-check.ok { background: var(--green-600); color: white; }
.cl-check.todo { border: 2px solid var(--amber-400); background: white; }
.cl-label { flex: 1; font-size: 13px; color: var(--slate-600); }
.cl-row.todo .cl-label { color: var(--slate-800); font-weight: 600; }
.pill { font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 999px; border: 1px solid; }
.pill.ok { background: var(--green-50); border-color: var(--green-200); color: var(--green-700); }
.pill.todo { background: var(--amber-50); border-color: var(--amber-300); color: var(--amber-700); }
.icon-btn { width: 28px; height: 28px; border-radius: 7px; border: 1px solid transparent; background: none; color: var(--slate-400); display: grid; place-items: center; cursor: pointer; }
.icon-btn:hover { background: var(--slate-100); color: var(--slate-700); }
.cl-row.todo .icon-btn { color: var(--amber-700); border-color: var(--amber-300); background: var(--amber-50); }

/* ── Account cards ── */
.acct-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.acard { background: white; border: 1px solid var(--slate-200); border-radius: 14px; padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; }
.acard.cat  { background: var(--blue-50); border-color: var(--blue-200); }
.acard.wait { background: var(--amber-50); border-color: var(--amber-300); }
.ac-head { display: flex; align-items: flex-start; gap: 12px; }
.ac-ico { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; flex: none; background: var(--indigo-50); color: var(--indigo-600); }
.acard.ready .ac-ico { background: var(--green-50); color: var(--green-600); }
.acard.wait .ac-ico { background: var(--amber-100); color: var(--amber-700); }
.ac-name { font-size: 14px; font-weight: 700; color: var(--slate-800); padding-top: 2px; }
.ac-status { display: flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 500; }
.ac-status .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.ac-status.blue  { color: var(--blue-600); }
.ac-status.green { color: var(--green-700); }
.ac-status.amber { color: var(--amber-700); }
.ac-status.blue .dot, .ac-status.amber .dot { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
@media (prefers-reduced-motion: reduce) { .ac-status .dot { animation: none; } }
.ac-stats { display: flex; gap: 28px; }
.ac-v { font-size: 18px; font-weight: 700; color: var(--slate-800); font-variant-numeric: tabular-nums; }
.ac-v.blue { color: var(--blue-600); } .ac-v.green { color: var(--green-600); }
.ac-k { font-size: 10.5px; color: var(--slate-400); text-transform: uppercase; letter-spacing: .05em; margin-top: 2px; }
.ac-btn { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; padding: 7px 14px; border-radius: 9px; border: 1px solid var(--indigo-200); background: white; color: var(--primary-dark); text-decoration: none; cursor: pointer; font-family: inherit; }
.ac-btn:hover { background: var(--indigo-50); }
.acard.wait .ac-btn { border-color: var(--amber-400); color: var(--amber-800); }
.acard.wait .ac-btn:hover { background: var(--amber-100); }
.ac-note { font-size: 11.5px; color: var(--amber-700); }

/* ── Right panel ── */
.aside { width: 260px; flex: none; background: white; border: 1px solid var(--slate-200); border-radius: 14px; padding: 18px; }
.cap { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--slate-400); margin-bottom: 10px; }
.period { background: var(--indigo-50); border: 1px solid var(--indigo-100); border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; }
.period .p { font-size: 14px; font-weight: 700; color: var(--indigo-600); }
.period .d { font-size: 11px; color: var(--slate-500); margin-top: 2px; }
.prow { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 4px 0; }
.prow .k { font-size: 12px; color: var(--slate-500); }
.prow .v { font-size: 12.5px; font-weight: 600; color: var(--slate-800); text-align: right; }

.toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--slate-900); color: white; padding: 10px 16px; border-radius: 10px; font-size: 12.5px; font-weight: 600; display: none; z-index: 60; }

@media (max-width: 1100px) { .cols { flex-direction: column; } .aside { width: 100%; } }
@media (max-width: 760px)  { .acct-grid { grid-template-columns: 1fr; } .page { padding: 20px 16px 40px; } }
</style>
</head>
<body>

<!-- Shared left nav (assets/atlas-nav.js) -->
<div data-atlas-nav data-active="bookkeeping/projects" data-client="bright-bloom"></div>

<div class="main">
  <div class="page">

    <div class="head">
      <nav class="crumb">
        <a href="projects-list.html">Projects</a><span class="sep">/</span>
        <a href="clients-list.html">Bright &amp; Bloom LLC</a><span class="sep">/</span>
        <span class="cur">Book Close — Q1 2025</span>
      </nav>
      <div class="spacer"></div>
      <!-- Count = documents that need you (Needs classification + Needs review) on the documents page. -->
      <a class="btn primary" href="bookkeeping-documents.html">Documents <span class="badge">7</span></a>
      <button class="btn" data-toast="Syncing connected sources…">
        <svg width="13" height="13" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
        Sync
      </button>
      <button class="btn" data-toast="Re-running enrichment on ingested transactions…">
        <svg width="13" height="13" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
        Re-run enrichment
      </button>
      <a class="btn soft" href="bookkeeping-project-v3.html">Review All Transactions</a>
      <button class="btn disabled" disabled title="Complete the project once every checklist item is in and transactions are reviewed">Complete Project</button>
    </div>

    <div class="cols">
      <div class="main-col">

        <section>
          <div class="sec-hd"><span class="sec-title">Checklist</span><span class="sec-meta" id="cl-meta"></span></div>
          <div class="checklist" id="checklist"></div>
        </section>

        <section>
          <div class="sec-hd"><span class="sec-title">Accounts</span><span class="sec-meta" id="ac-meta"></span></div>
          <div class="acct-grid" id="accounts"></div>
        </section>

      </div>

      <aside class="aside">
        <div class="cap">Project period</div>
        <div class="period"><div class="p">Jan 1 – Mar 31, 2025</div><div class="d">90 days</div></div>
        <div class="prow"><span class="k">Client</span><span class="v">Bright &amp; Bloom LLC</span></div>
        <div class="prow"><span class="k">Opened</span><span class="v">Apr 2, 2025</span></div>
        <div class="prow"><span class="k">Due</span><span class="v">Apr 30, 2025</span></div>
        <div class="prow"><span class="k">Assigned to</span><span class="v">Sarah K.</span></div>
      </aside>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  // One account per checklist item. status: wait (no statement yet) | cat (categorizing) | ready.
  const ACCOUNTS = [
    { name: "Wells Fargo Business Checking - 2201", status: "cat",   ingested: 891, categorized: 847 },
    { name: "Amex Business Credit Card - 8344",     status: "cat",   ingested: 614, categorized: 412 },
    { name: "Bank of America Savings - 7823",       status: "ready", ingested: 342, categorized: 342 },
    { name: "Chase Business Checking - 4951",       status: "wait",  ingested: 0,   categorized: 0 },
  ];

  const ICON = {
    card:   '<svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"/></svg>',
    upload: '<svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>',
    check:  '<svg width="11" height="11" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3.5" d="M5 13l4 4L19 7"/></svg>',
  };
  const fmt = (n) => n.toLocaleString();

  function renderChecklist() {
    const done = ACCOUNTS.filter((a) => a.status !== "wait").length;
    const total = ACCOUNTS.length;
    const missing = total - done;
    const rows = ACCOUNTS.map((a) => {
      const ok = a.status !== "wait";
      return `<div class="cl-row ${ok ? "" : "todo"}">
        <span class="cl-check ${ok ? "ok" : "todo"}">${ok ? ICON.check : ""}</span>
        <span class="cl-label">Bank statement for ${a.name}</span>
        <span class="pill ${ok ? "ok" : "todo"}">${ok ? "Received" : "Missing"}</span>
        <button class="icon-btn" title="Upload statement" data-toast="Upload a statement for ${a.name} — it lands in Documents and is auto-classified">${ICON.upload}</button>
      </div>`;
    }).join("");
    document.getElementById("checklist").innerHTML = `
      <div class="cl-top">
        <div class="cl-count"><b>${done} of ${total}</b> items complete</div>
        <div class="cl-bar"><div class="cl-fill" style="width:${Math.round((done / total) * 100)}%"></div></div>
      </div>${rows}`;
    const meta = document.getElementById("cl-meta");
    meta.textContent = missing ? `${missing} item still needed` : "everything required is in";
    meta.classList.toggle("need", missing > 0);
  }

  function accountCard(a) {
    if (a.status === "wait") {
      return `<div class="acard wait">
        <div class="ac-head"><div class="ac-ico">${ICON.upload}</div><div class="ac-name">${a.name}</div></div>
        <div class="ac-status amber"><span class="dot"></span>Waiting for statement</div>
        <div class="ac-note">Nothing to categorize until the Jan 1 – Mar 31, 2025 statement arrives.</div>
        <button class="ac-btn" data-toast="Upload a statement for ${a.name} — it lands in Documents and is auto-classified">${ICON.upload} Upload statement</button>
      </div>`;
    }
    const ready = a.status === "ready";
    const tone = ready ? "green" : "blue";
    const status = ready
      ? "Categorized, ready for review"
      : `Pending for categorization, ${fmt(a.categorized)} of ${fmt(a.ingested)} done`;
    return `<div class="acard ${ready ? "ready" : "cat"}">
      <div class="ac-head"><div class="ac-ico">${ICON.card}</div><div class="ac-name">${a.name}</div></div>
      <div class="ac-status ${tone}"><span class="dot"></span>${status}</div>
      <div class="ac-stats">
        <div><div class="ac-v">${fmt(a.ingested)}</div><div class="ac-k">Ingested</div></div>
        <div><div class="ac-v ${tone}">${fmt(a.categorized)}</div><div class="ac-k">Categorized</div></div>
      </div>
      <a class="ac-btn" href="bookkeeping-project-v3.html">Review ${fmt(a.categorized)} transactions →</a>
    </div>`;
  }

  function renderAccounts() {
    const count = (s) => ACCOUNTS.filter((a) => a.status === s).length;
    document.getElementById("ac-meta").textContent =
      `${ACCOUNTS.length} accounts · ${count("ready")} ready · ${count("wait")} waiting · ${count("cat")} categorizing`;
    document.getElementById("accounts").innerHTML = ACCOUNTS.map(accountCard).join("");
  }

  let toastTimer;
  function toast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg; t.style.display = "block";
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.style.display = "none"; }, 3000);
  }
  document.addEventListener("click", (e) => {
    const el = e.target.closest("[data-toast]");
    if (el) toast(el.dataset.toast);
  });

  renderChecklist();
  renderAccounts();
</script>

<script src="assets/atlas-nav.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Atlas &mdash; Invoice review (Workflows &rarr; Run &rarr; Review)</title>
<style>
/* The review surface for `parse_invoice` (ATLS-316).

   Mirrors the shipped console rather than inventing a look -- same sources as
   bookkeeping-feeds.html, whose palette and type stacks this reuses verbatim:
     maven-frontend/tailwind.config.ts             - primary/success/warning/danger/slate
     maven-frontend/src/app/globals.css            - radii, shadows, base body treatment
     maven-frontend/src/features/layout/Sidebar/   - the navy gradient, 3px active accent
     maven-frontend/src/components/ui/{Badge,PageHeader}.tsx

   Drawn against the REAL payload contract, not an imagined one:
     maven-specs/.../ATLS-316-invoice-extraction-backend/contracts/review-payload.md
   Every figure rendered here comes from the backend in that shape. Nothing on this
   screen is computed in-page -- the residual, the counts and the verdicts are emitted,
   which is contract rule 1 and the reason the real screen cannot drift from the ledger.

   The three specimens carry their real measured figures, because each breaks something
   a generic fixture would not:
     Feelflux   a -21.90 coupon; a tax component labelled EUKT whose rate is genuinely null
     Kaapi      CGST and SGST at 7,650 each -- two components identical but for their label
     Hangzhou   six lines, two of them charges with no quantity and no rate, and no tax at all
   A fourth invoice is a FAILED read, because every invoice reaches this gate including one
   that could not be read (FR-018).

   Page pane: a schematic. The shipped screen renders the real PDF client-side through
   pdfjs-dist, which this repo has no build step for. That is a mock limitation, not the
   design. */

*, *::before, *::after{ box-sizing:border-box }
body, h1, h2, h3, p, dl, dd, ul, figure{ margin:0 }
ul{ padding:0; list-style:none }
button{ font:inherit; color:inherit }

:root{
  --bg:#f8fafc; --surface:#ffffff; --surface-2:#f1f5f9; --surface-3:#e9eef5;
  --border:#e2e8f0; --border-strong:#cbd5e1;
  --ink:#0f172a; --ink-2:#475569; --ink-3:#64748b;
  --accent:#4f46e5; --accent-hover:#4338ca; --accent-weak:#eef2ff; --accent-ink:#4338ca;
  --ok:#059669; --ok-weak:#ecfdf5; --warn:#d97706; --warn-weak:#fffbeb;
  --bad:#e11d48; --bad-weak:#fff1f2;
  --out:#b4441f; --in:#2f6f4e;
  --ring:rgba(79,70,229,.35);
  --shadow-sm:0 1px 3px 0 rgb(15 23 42 / .08), 0 1px 2px -1px rgb(15 23 42 / .06);
  --shadow-lg:0 10px 15px -3px rgb(15 23 42 / .10), 0 4px 6px -4px rgb(15 23 42 / .10);
}

body{
  font-family:'Hanken Grotesk','Plus Jakarta Sans',Inter,system-ui,-apple-system,'Segoe UI',sans-serif;
  background:var(--bg); color:var(--ink); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.mono{ font-family:'Spline Sans Mono','JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
       font-variant-numeric:tabular-nums }

/* ── Shell ──────────────────────────────────────────────────────────────────── */
.app{ display:grid; grid-template-columns:232px 1fr; min-height:100vh }
.side{ background:linear-gradient(180deg,#111a2e 0%,#0d1424 100%); color:#cbd5e1; padding:18px 0 }
.brand{ display:flex; align-items:center; gap:9px; padding:0 18px 18px; font-weight:700; color:#fff;
        letter-spacing:-.2px }
.brand .dot{ width:22px; height:22px; border-radius:7px; background:var(--accent); display:grid;
             place-items:center; font-size:12px }
.navgroup{ padding:14px 18px 6px; font-size:10.5px; letter-spacing:.09em; text-transform:uppercase;
           color:#64748b; font-weight:700 }
.navitem{ display:flex; align-items:center; gap:9px; padding:7px 18px; color:#cbd5e1; font-size:13px;
          border-left:3px solid transparent; cursor:default }
.navitem.child{ padding-left:34px; font-size:12.5px; color:#94a3b8 }
.navitem.on{ background:rgba(79,70,229,.16); border-left-color:var(--accent); color:#fff; font-weight:600 }

.main{ display:flex; flex-direction:column; min-width:0 }

/* ── Header ─────────────────────────────────────────────────────────────────── */
.head{ background:var(--surface); border-bottom:1px solid var(--border); padding:14px 22px }
.crumbs{ font-size:12px; color:var(--ink-3); margin-bottom:5px }
.headrow{ display:flex; align-items:flex-start; justify-content:space-between; gap:18px; flex-wrap:wrap }
.title{ font-size:19px; font-weight:700; letter-spacing:-.3px }
.subtitle{ font-size:12.5px; color:var(--ink-3); margin-top:2px }
.headactions{ display:flex; align-items:center; gap:9px }

.btn{ border:1px solid var(--border-strong); background:var(--surface); border-radius:8px;
      padding:7px 13px; font-size:13px; font-weight:600; cursor:pointer }
.btn:hover{ background:var(--surface-2) }
.btn.primary{ background:var(--accent); border-color:var(--accent); color:#fff }
.btn.primary:hover{ background:var(--accent-hover) }
.btn.danger{ color:var(--bad); border-color:#fecdd3 }
.btn.danger:hover{ background:var(--bad-weak) }
.btn[disabled]{ opacity:.45; cursor:not-allowed }

.pill{ display:inline-flex; align-items:center; gap:5px; border-radius:999px; padding:2px 9px;
       font-size:11.5px; font-weight:700; border:1px solid transparent; white-space:nowrap }
.pill.ok{ background:var(--ok-weak); color:var(--ok); border-color:#a7f3d0 }
.pill.warn{ background:var(--warn-weak); color:var(--warn); border-color:#fde68a }
.pill.bad{ background:var(--bad-weak); color:var(--bad); border-color:#fecdd3 }
.pill.mute{ background:var(--surface-2); color:var(--ink-2); border-color:var(--border) }
.pill.accent{ background:var(--accent-weak); color:var(--accent-ink); border-color:#c7d2fe }

/* The read-only banner. A non-member sees the invoice and is told why, never an empty screen. */
.banner{ display:flex; gap:9px; align-items:flex-start; padding:9px 13px; border-radius:9px;
         font-size:12.5px; margin-top:11px; border:1px solid }
.banner.info{ background:var(--accent-weak); border-color:#c7d2fe; color:#312e81 }

/* ── Invoice selector ───────────────────────────────────────────────────────── */
.selector{ display:flex; align-items:center; gap:11px; padding:9px 22px; background:var(--surface-2);
           border-bottom:1px solid var(--border); flex-wrap:wrap }
.chips{ display:flex; gap:6px; flex-wrap:wrap }
.chip{ border:1px solid var(--border-strong); background:var(--surface); border-radius:999px;
       padding:4px 11px; font-size:12px; cursor:pointer; display:flex; align-items:center; gap:6px }
.chip.on{ border-color:var(--accent); background:var(--accent-weak); color:var(--accent-ink); font-weight:700 }
.chip .st{ width:7px; height:7px; border-radius:50% }
.st.acc{ background:var(--ok) } .st.exc{ background:var(--bad) } .st.und{ background:var(--border-strong) }
.counts{ margin-left:auto; font-size:12px; color:var(--ink-2) }

/* ── Body ───────────────────────────────────────────────────────────────────── */
.body{ display:grid; grid-template-columns:92px minmax(0,1fr) 340px; gap:0; flex:1; min-height:0 }

/* The rail. `derived` is present and disabled on purpose -- a reviewer can see it is coming
   and that nothing is hiding behind it. An empty column nobody expected reads as a bug. */
.rail{ border-right:1px solid var(--border); background:var(--surface); padding:11px 0 }
.railitem{ width:100%; border:0; background:none; display:grid; gap:3px; justify-items:center;
           padding:11px 4px; cursor:pointer; color:var(--ink-2); font-size:10.5px; font-weight:600 }
.railitem .ic{ font-size:17px; line-height:1 }
.railitem.on{ background:var(--accent-weak); color:var(--accent-ink) }
.railitem[disabled]{ color:var(--border-strong); cursor:not-allowed }

.pane{ padding:18px 22px; overflow:auto; min-width:0 }
.card{ background:var(--surface); border:1px solid var(--border); border-radius:11px;
       box-shadow:var(--shadow-sm); margin-bottom:15px }
.cardhead{ display:flex; align-items:center; justify-content:space-between; gap:11px;
           padding:11px 15px; border-bottom:1px solid var(--border) }
.cardtitle{ font-weight:700; font-size:13.5px }
.cardbody{ padding:13px 15px }

table{ width:100%; border-collapse:collapse; font-size:13px }
th{ text-align:left; font-size:10.5px; letter-spacing:.07em; text-transform:uppercase;
    color:var(--ink-3); font-weight:700; padding:7px 9px; border-bottom:1px solid var(--border) }
td{ padding:8px 9px; border-bottom:1px solid var(--surface-2); vertical-align:top }
tr:last-child td{ border-bottom:0 }
td.num, th.num{ text-align:right }
.neg{ color:var(--out); font-weight:600 }

.lbl{ display:inline-block; border-radius:5px; padding:1px 6px; font-size:10.5px; font-weight:700;
      background:var(--surface-2); color:var(--ink-2); border:1px solid var(--border) }
.lbl.item{ background:#eff6ff; color:#1d4ed8; border-color:#bfdbfe }
.lbl.charge{ background:var(--warn-weak); color:var(--warn); border-color:#fde68a }
.lbl.discount{ background:var(--bad-weak); color:var(--bad); border-color:#fecdd3 }

/* "Printed on the page, not read" -- visibly NOT data. Code never turns one into a line. */
.notread td{ background:repeating-linear-gradient(45deg,#fff,#fff 6px,#fffbeb 6px,#fffbeb 12px);
             border-top:1px dashed var(--warn); border-bottom:1px dashed var(--warn) }

/* ── Findings ───────────────────────────────────────────────────────────────── */
.finding{ border:1px solid var(--border); border-left:3px solid var(--warn); border-radius:9px;
          padding:11px 13px; margin-bottom:9px; background:var(--surface) }
.finding.error{ border-left-color:var(--bad) }
.finding.note{ border-left-color:var(--ink-3) }
.finding .headline{ font-size:13px; margin:5px 0 }
.finding .remedy{ font-size:12.5px; color:var(--accent-ink); font-weight:600 }
.finding .meta{ font-size:11px; color:var(--ink-3) }

/* ── Identities / totals ladder ─────────────────────────────────────────────── */
.ladder{ display:grid; grid-template-columns:1fr auto; gap:4px 13px; font-size:13px }
.ladder .k{ color:var(--ink-2) }
.ladder .v{ text-align:right }
.ladder .rule{ grid-column:1/-1; border-top:1px solid var(--border); margin:4px 0 }
.ladder .total{ font-weight:700 }

.identity{ display:flex; gap:9px; align-items:flex-start; padding:9px 0; border-top:1px solid var(--surface-2) }
.identity:first-child{ border-top:0 }

/* ── Right column ───────────────────────────────────────────────────────────── */
.aside{ border-left:1px solid var(--border); background:var(--surface); padding:15px; overflow:auto }
.asidehead{ font-size:10.5px; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-3);
            font-weight:700; margin:15px 0 7px }
.asidehead:first-child{ margin-top:0 }

/* The page pane is schematic -- see the header comment. */
.pagestrip{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:9px }
.pagethumb{ width:44px; height:58px; border-radius:5px; border:1px solid var(--border-strong);
            background:var(--surface-2); display:grid; place-items:center; font-size:10px;
            color:var(--ink-3); cursor:pointer; position:relative }
.pagethumb.on{ border-color:var(--accent); box-shadow:0 0 0 2px var(--ring) }
.pagethumb.att{ background:repeating-linear-gradient(45deg,#f8fafc,#f8fafc 4px,#eef2f7 4px,#eef2f7 8px) }
.pagesheet{ border:1px solid var(--border-strong); border-radius:7px; background:#fff; height:230px;
            display:grid; place-items:center; color:var(--ink-3); font-size:12px; text-align:center;
            padding:15px; background-image:linear-gradient(var(--surface-2) 1px, transparent 1px);
            background-size:100% 13px }

.evt{ display:grid; gap:2px; padding:8px 0; border-top:1px solid var(--surface-2); font-size:12.5px }
.evt:first-of-type{ border-top:0 }
.evt .who{ font-size:11px; color:var(--ink-3) }

.note{ width:100%; border:1px solid var(--border-strong); border-radius:8px; padding:8px 10px;
       font-size:12.5px; font-family:inherit; resize:vertical; min-height:64px }
.note:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--ring) }
.refusal{ border:1px solid #fecdd3; background:var(--bad-weak); border-radius:8px; padding:9px 11px;
          font-size:12px; color:#9f1239; margin-top:8px }
.refusal .rule{ font-weight:700; text-transform:uppercase; font-size:10px; letter-spacing:.06em }

.footer{ border-top:1px solid var(--border); background:var(--surface); padding:11px 22px;
         display:flex; align-items:center; gap:11px; justify-content:flex-end }
.footer .left{ margin-right:auto; font-size:12.5px; color:var(--ink-2) }
.hint{ font-size:11.5px; color:var(--ink-3); margin-top:5px }
.mut{ color:var(--ink-3) }
</style>
</head>
<body>
<div class="app">
  <nav class="side">
    <div class="brand"><span class="dot">A</span> Atlas</div>
    <div class="navgroup">Bookkeeping</div>
    <div class="navitem child">Feeds</div>
    <div class="navitem child">Projects</div>
    <div class="navitem child">Documents</div>
    <div class="navgroup">Workflows</div>
    <div class="navitem child on">Runs</div>
    <div class="navitem child">Recipes</div>
  </nav>

  <div class="main">
    <header class="head">
      <div class="crumbs">Workflows &rsaquo; Run #610 &mdash; Read a Supplier Invoice &rsaquo; Review</div>
      <div class="headrow">
        <div>
          <h1 class="title" id="fileName">feelflux-batch.pdf</h1>
          <div class="subtitle" id="fileSub"></div>
        </div>
        <div class="headactions">
          <button class="btn" id="btnReask">Re-ask the model&hellip;</button>
          <button class="btn danger" id="btnExclude">Exclude&hellip;</button>
          <button class="btn primary" id="btnAccept">Accept</button>
          <button class="btn primary" id="btnFinish">Finish review</button>
        </div>
      </div>
      <div class="banner info" id="readonlyBanner" hidden></div>
    </header>

    <div class="selector">
      <div class="chips" id="chips"></div>
      <div class="counts" id="counts"></div>
    </div>

    <div class="body">
      <nav class="rail" id="rail"></nav>
      <section class="pane" id="pane"></section>
      <aside class="aside" id="aside"></aside>
    </div>

    <footer class="footer">
      <div class="left" id="footNote"></div>
      <button class="btn" id="btnPrev">&larr; Previous</button>
      <button class="btn" id="btnNext">Next &rarr;</button>
    </footer>
  </div>
</div>

<script>
/* ---------------------------------------------------------------------------
   The payload, in the shape `contracts/review-payload.md` specifies.

   Written out rather than generated, because the point of this mock is that the
   figures are the MEASURED ones. Every amount below appears in the backend's own
   fixtures (accounting/bookkeeping/workflows/parse_invoice/tests/fixtures/).
   --------------------------------------------------------------------------- */
const PAYLOAD = {
  run: {
    run_id: '610', requested_run_id: '609', status: 'PAUSED_FOR_GATE',
    gate_node_id: 'review', file_name: 'feelflux-batch.pdf',
    may_review: true, read_only_reason: '', applied_changes: 2,
    page_census: {
      page_count: 11, classified_count: 11, accounted_for: true, unaccounted: [],
      counts: { invoice: 4, continuation: 1, duplicate: 1, attachment: 5 },
      pages: []

    cost: { triage: { reads: 2, page_sends: 11 }, transcription: { reads: 20, page_sends: 24 },
            verify: { reads: 4, page_sends: 6 } },
    undecided_count: 3, accepted_count: 1, excluded_count: 0, invoice_count: 4,
    can_finish: false,
    invoices: [
      {
        invoice_key: 'doc-1371:p1', page_ranges: [[1,1],[3,3]], copy_count: 2,
        basis: 'page 1 prints the start of an invoice; page 3 reprints it',
        decision: 'accepted', excluded_reason: null, read_failed: false, failure: '',
        header: { vendor_name: 'Feel Flux Kft.', vendor_tax_id: 'HU24985846',
                  invoice_number: 'FLX-2025-235', invoice_date: '2025-09-26',
                  currency_code: 'USD', payment_terms: 'TransferWise',
                  subtotal_printed: '222.10', tax_total_printed: '0.00',
                  grand_total_printed: '222.10', amount_due_printed: '222.10',
                  vendor_bank_account: 'HU42 1177 3016 1111 1018 0000 0000' },
        lines: [
          { ordinal:1, label:'item', page_number:1, item_name:'Feel Flux - FLUX Original',
            quantity:'1', unit:'EA', unit_price:'120.00', line_amount:'120.00' },
          { ordinal:2, label:'item', page_number:1, item_name:'Spin Flux (Mirror Nickel)',
            quantity:'1', unit:'EA', unit_price:'99.00', line_amount:'99.00' },
          { ordinal:3, label:'discount', page_number:1, item_name:'COUPON',
            quantity:'1', unit_price:'-21.90', line_amount:'-21.90' },
          { ordinal:4, label:'charge', page_number:1, item_name:'Flat Rate Shipping',
            quantity:'1', unit_price:'25.00', line_amount:'25.00' }
        ],
        tax_components: [ { ordinal:1, label:'EUKT', rate:null, amount:'0.00' } ],
        reconcile: { reconciles:true, residual:'0.00', findings:[], not_read:[],
          identities:[
            { name:'printed_total', left:'222.10', right:'222.10', holds:true,
              sentence:"The invoice's own summary block adds up: its subtotal, tax, freight and adjustments come to the total it prints." },
            { name:'lines_against_subtotal', left:'222.10', right:'222.10', holds:true,
              sentence:'Every line we read adds up to the pre-tax subtotal the invoice prints.' }
          ],
          census:{ transcribed:4, presented:3, excluded:0, charge_lines:1, holds:true } },
        verdicts:[
          { check:'total_agreement', outcome:'passed', figure:'222.10', ours:'222.10',
            sentence:'A second reading of the pages, shown none of our figures, also read the total as 222.10.' },
          { check:'line_count', outcome:'passed', sentence:'A second reading counted 4 lines in the grid, as we did.' }
        ],
        auto_verify:{ gates:[
          { name:'arithmetic', passed:true, evaluated:true, sentence:'The lines and tax add up to the printed total exactly.' },
          { name:'independent_checks', passed:true, evaluated:true, sentence:'All 2 independent checks agree.' },
          { name:'confidence_floor', passed:false, evaluated:false,
            sentence:'No per-field confidence signal exists in this version, so this gate could not be evaluated. It is recorded as unevaluated rather than as satisfied: an absent signal is not a high-confidence one.' }
        ], may_skip_review:false,
           sentence:'This invoice needs a reviewer: 2 of 3 gates passed (arithmetic, independent_checks); 1 could not be evaluated (confidence_floor). The arithmetic closing is not on its own grounds to skip review.' }
      },
      {
        invoice_key: 'doc-1371:p4', page_ranges: [[4,5]], copy_count: 1,
        basis: 'page 4 prints the start of an invoice and page 5 continues it',
        decision: 'undecided', excluded_reason: null, read_failed: false, failure: '',
        header: { vendor_name: 'Kaapi Machines (India) Pvt. Ltd.', vendor_gstin:'29AACCK9538Q1ZK',
                  invoice_number: '252910650', invoice_date: '2025-07-31',
                  currency_code: 'INR', payment_terms: 'Immediate',
                  subtotal_printed:'85000.00', tax_total_printed:'15300.00',
                  grand_total_printed:'100300.00', amount_due_printed:'100300.00',
                  source_of_supply_printed:'29/Karnataka' },
        lines: [
          { ordinal:1, label:'item', page_number:1, item_code:'BUDM80L', item_name:'Budan M80',
            quantity:'1.00', unit:'NOS', unit_price:'85000.00', line_amount:'85000.00',
            hsn_sac:'84.19.8190' }
        ],
        tax_components: [
          { ordinal:1, label:'CGST', rate:'9', amount:'7650.00' },
          { ordinal:2, label:'SGST', rate:'9', amount:'7650.00' },
          { ordinal:3, label:'IGST', rate:'0', amount:'0.00' }
        ],
        reconcile:{ reconciles:true, residual:'0.00', findings:[], not_read:[],
          identities:[
            { name:'printed_total', left:'100300.00', right:'100300.00', holds:true,
              sentence:"The invoice's own summary block adds up." },
            { name:'lines_against_subtotal', left:'85000.00', right:'85000.00', holds:true,
              sentence:'Every line we read adds up to the pre-tax subtotal the invoice prints.' }
          ],
          census:{ transcribed:1, presented:1, excluded:0, charge_lines:0, holds:true } },
        verdicts:[
          { check:'total_agreement', outcome:'passed', figure:'100300.00', ours:'100300.00',
            sentence:'A second reading of the pages also read the total as 100300.00.' },
          { check:'line_count', outcome:'does_not_apply',
            sentence:'The second reading returned no line count, so there is nothing to compare. That is not a disagreement.' }
        ],
        auto_verify:{ gates:[], may_skip_review:false, sentence:'This invoice needs a reviewer.' }
      },
      {
        invoice_key: 'doc-1371:p6', page_ranges: [[6,6]], copy_count: 1,
        basis: 'page 6 prints the start of an invoice',
        decision: 'undecided', excluded_reason: null, read_failed: false, failure: '',

                  invoice_number:'GP1154', invoice_date:'2026-01-26', currency_code:'USD',

          { ordinal:1, label:'item', page_number:6, item_code:'H2B-C9F-AI00036A',
            item_name:'H2B-C9F-AI00036A', quantity:'100', unit:'PCS', unit_price:'1.17', line_amount:'116.97' },
          { ordinal:2, label:'item', page_number:6, item_code:'H2B-C8F-AI00036A',
            item_name:'H2B-C8F-AI00036A', quantity:'100', unit:'PCS', unit_price:'1.17', line_amount:'116.97' },
          { ordinal:3, label:'item', page_number:6, item_code:'H2B-C7F-AI00036A',
            item_name:'H2B-C7F-AI00036A', quantity:'100', unit:'PCS', unit_price:'1.17', line_amount:'116.97' },
          { ordinal:4, label:'item', page_number:6, item_code:'H2B-C6F-AI00036A',
            item_name:'H2B-C6F-AI00036A', quantity:'250', unit:'PCS', unit_price:'0.59', line_amount:'146.96' },
          { ordinal:5, label:'charge', page_number:6, item_name:'Shipping fee', line_amount:'28.00' }
        ],
        tax_components: [],
        reconcile:{ reconciles:false, residual:'24.52',
          not_read:[ { source:'a printed charge', value:'24.52', pages:[6] } ],
          findings:[
            { kind:'merged_line', severity:'error', money_at_stake:'24.52', pages:[6], occurrences:1,
              headline:'One line looks to have been missed. The 24.52 left unaccounted for is exactly a charge or item of 24.52 — the invoice’s own total carries it and the 5 lines we read do not.',
              remedy:'Find a charge or item of 24.52 on the page and add it. The invoice then closes exactly.',
              suggested_note:{ kind:'merged_line',
                text:'Read every row printed in the item grid, including rows for shipping, fees, discounts and coupons. A row whose amount column is printed in brackets or with a leading minus is a discount row; report it at the sign printed.',
                because:'the arithmetic says one line is missing, and discount rows are the commonest miss' } },
            { kind:'line_census_failed', severity:'warning', pages:[6], occurrences:1,
              headline:'6 lines were read from this invoice but only 5 are accounted for — 1 has gone missing between the reading and the output. This is usually a response that was cut short.',
              remedy:'Ask for these pages to be read again — a cut-short response recovers on a retry.', suggested_note:null }
          ],
          identities:[
            { name:'printed_total', left:'497.87', right:'550.39', holds:false,
              sentence:'The invoice disagrees with itself: its own subtotal, tax, freight and adjustments do not come to the total it prints.' },
            { name:'lines_against_subtotal', left:'525.87', right:'497.87', holds:false,
              sentence:'The lines we read do not add up to the subtotal the invoice prints, so the grid was read wrongly — a line missed, doubled, or read at the wrong sign.' }
          ],
          census:{ transcribed:6, presented:4, excluded:0, charge_lines:1, holds:false } },
        verdicts:[
          { check:'total_agreement', outcome:'passed', figure:'550.39', ours:'550.39',
            sentence:'A second reading of the pages also read the total as 550.39.' },
          { check:'line_count', outcome:'failed',
            sentence:'A second reading counted 6 lines in the grid where we read 5. Two rows read as one leave the total unchanged, so the arithmetic cannot catch this — only the count can.' }
        ],
        auto_verify:{ gates:[], may_skip_review:false, sentence:'This invoice needs a reviewer.' }
      },
      {
        invoice_key: 'doc-1371:p7', page_ranges: [[7,7]], copy_count: 1, basis: 'page 7 prints an invoice',
        decision: 'undecided', excluded_reason: null,
        read_failed: true,
        failure: 'the provider returned no answer for these pages after three attempts',
        header: {}, lines: [], tax_components: [],
        reconcile:{ reconciles:false, residual:null, not_read:[],
          findings:[ { kind:'does_not_close', severity:'warning', pages:[7], occurrences:1,
            headline:'This invoice could not be checked: no total was read from this invoice, so nothing can be checked. Read the total from the page, or ask for the pages to be read again.',
            remedy:'', suggested_note:null } ],
          identities:[], census:{ transcribed:0, presented:0, excluded:0, charge_lines:0, holds:true } },
        verdicts:[ { check:'total_agreement', outcome:'failed',
          sentence:'We read no total from this invoice, so there is nothing to check the second reading against.' } ],
        auto_verify:{ gates:[], may_skip_review:false, sentence:'This invoice needs a reviewer.' }
      }
    ],
    activity: [
      { ordinal:1, kind:'line_corrected', at:'2026-09-11T09:14:00Z',
        actor:{ id:'u1', display_name:'priya@theatlas.ai' }, invoice_key:'doc-1371:p1',
        sentence:'priya@theatlas.ai corrected line_amount on line 3 from -2.19 to -21.90.',
        detail:{ field:'line_amount', line_ordinal:3, before:'-2.19', after:'-21.90' } },
      { ordinal:2, kind:'invoice_accepted', at:'2026-09-11T09:15:00Z',
        actor:{ id:'u1', display_name:'priya@theatlas.ai' }, invoice_key:'doc-1371:p1',
        sentence:'priya@theatlas.ai accepted this invoice.', detail:{ reconciles:true } }
    ]
  }
};

/* The four refusals the server returns for a re-ask note. Rendered verbatim: the wording is the
   backend's, and a screen that paraphrased a refusal would be a second owner of the rule. */
const REFUSALS = {
  no_figure:{ rule:'no_figure', detail:'This note names a figure, so it cannot be sent. A model told what a total should be will produce that total, and the invoice then appears to add up against a number we supplied rather than one it printed — a false proof, which is the one outcome this check exists to prevent. Describe the LAYOUT and the LABELS instead.' },
  scope:{ rule:'scope', detail:'This note reaches beyond this invoice. A re-read covers the pages you selected and only those — which pages are read comes from your selection, never from the note.' },
  direction:{ rule:'direction', detail:'This finding says something is MISSING, and this note asks for less to be returned. That combination has lost real data twice. Ask for the rows to be read, not for any to be left out.' },
  length:{ rule:'length', detail:'This note is over the 300-character limit. A note says where to look on the page; a long one is usually trying to describe the data instead.' }
};

/* --------------------------------------------------------------------------- */
const run = PAYLOAD.run;
let current = 0;
let section = 'lines';
let reaskOpen = false;
let refusal = null;

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* Currency-aware, because the register's own money() is USD-hardcoded and an INR invoice
   rendered as dollars is worse than an unformatted number. */
function amt(v, ccy){
  if (v === null || v === undefined || v === '') return '<span class="mut">&mdash;</span>';
  const n = Number(v);
  if (Number.isNaN(n)) return esc(v);
  const s = new Intl.NumberFormat('en-US',{ style:'currency', currency: ccy || 'USD',
    minimumFractionDigits:2, maximumFractionDigits:2 }).format(n);
  return n < 0 ? '<span class="neg">' + esc(s) + '</span>' : esc(s);
}
const inv = () => run.invoices[current];
const ccy = () => inv().header.currency_code || 'USD';

const SECTIONS = [
  { key:'lines',    icon:'≡', label:'Lines' },
  { key:'totals',   icon:'Σ', label:'Totals & tax' },
  /* Present and disabled on purpose. Calculated values arrive with the later inference feature;
     a greyed section that says so beats an empty column nobody expected. */
  { key:'derived',  icon:'ƒ', label:'Derived', ready:false, title:'Derived — not built yet' },
  { key:'activity', icon:'↺', label:'Activity' }
];

function renderRail(){
  $('rail').innerHTML = SECTIONS.map((s) =>
    '<button class="railitem' + (s.key === section ? ' on' : '') + '"' +
    (s.ready === false ? ' disabled title="' + esc(s.title) + '"' : '') +
    ' data-sec="' + s.key + '"><span class="ic">' + s.icon + '</span>' + esc(s.label) + '</button>'
  ).join('');
  $('rail').querySelectorAll('[data-sec]').forEach((b) => {
    b.onclick = () => { if (!b.disabled) { section = b.dataset.sec; renderAll(); } };
  });
}

function renderChips(){
  $('chips').innerHTML = run.invoices.map((iv, i) => {
    const st = iv.decision === 'accepted' ? 'acc' : iv.decision === 'excluded' ? 'exc' : 'und';
    const name = iv.read_failed ? 'Could not be read'
      : (iv.header.invoice_number || iv.invoice_key);
    return '<button class="chip' + (i === current ? ' on' : '') + '" data-i="' + i + '">' +
           '<span class="st ' + st + '"></span>' + esc(name) + '</button>';
  }).join('');
  $('chips').querySelectorAll('[data-i]').forEach((b) => {
    b.onclick = () => { current = Number(b.dataset.i); reaskOpen = false; refusal = null; renderAll(); };
  });
  $('counts').innerHTML =
    '<strong>Invoice ' + (current + 1) + ' of ' + run.invoice_count + '</strong> &nbsp;&middot;&nbsp; ' +
    run.accepted_count + ' accepted &middot; ' + run.undecided_count + ' undecided &middot; ' +
    run.excluded_count + ' excluded';
}

function renderHeader(){
  const c = run.page_census;
  $('fileName').textContent = run.file_name;
  $('fileSub').innerHTML =
    run.invoice_count + ' invoices &middot; ' + c.page_count + ' pages, all accounted for ' +
    '(' + Object.entries(c.counts).map(([k, v]) => v + ' ' + k).join(', ') + ')';

  const banner = $('readonlyBanner');
  if (!run.may_review){ banner.hidden = false; banner.innerHTML = '<span>&#128274;</span><span>' + esc(run.read_only_reason) + '</span>'; }
  else banner.hidden = true;

  /* Finishing is refused while any invoice is undecided -- the button says so rather than
     failing on click. */
  const fin = $('btnFinish');
  fin.disabled = !run.can_finish || !run.may_review;
  fin.textContent = run.can_finish ? 'Finish review' : 'Finish review · ' + run.undecided_count + ' left';
  fin.title = run.can_finish ? '' :
    run.undecided_count + ' invoice(s) have not been accepted or excluded yet. Every invoice needs a decision.';

  ['btnAccept','btnExclude','btnReask'].forEach((id) => { $(id).disabled = !run.may_review; });
  $('btnAccept').textContent = inv().decision === 'accepted' ? 'Accepted ✓' : 'Accept';
  $('footNote').innerHTML = run.applied_changes + ' reviewer change(s) folded into this view';
}

function linesTable(){
  const iv = inv();
  if (iv.read_failed){
    return '<div class="cardbody"><span class="pill bad">Could not be read</span>' +
      '<p class="headline" style="margin-top:9px">' + esc(iv.failure) + '</p>' +
      '<p class="hint">It still reaches this review, carrying its page accounting and no lines &mdash; ' +
      'so it can be repaired here rather than disappearing from the run.</p></div>';
  }
  const rows = iv.lines.map((l) =>
    '<tr><td class="mono">' + l.ordinal + '</td>' +
    '<td><span class="lbl ' + esc(l.label) + '">' + esc(l.label) + '</span></td>' +
    '<td>' + esc(l.item_name || '') +
      (l.item_code ? '<div class="hint mono">' + esc(l.item_code) + '</div>' : '') + '</td>' +
    '<td class="num mono">' + (l.quantity ? esc(l.quantity) : '<span class="mut">&mdash;</span>') + '</td>' +
    '<td class="num mono">' + (l.unit_price ? amt(l.unit_price, ccy()) : '<span class="mut">&mdash;</span>') + '</td>' +
    '<td class="num mono">' + amt(l.line_amount, ccy()) + '</td></tr>'
  ).join('');

  /* A figure the page carries that no line does. Offered, never invented. */
  const notread = (iv.reconcile.not_read || []).map((n) =>
    '<tr class="notread"><td colspan="3"><strong>Printed on the page, not read</strong> ' +
    '<span class="hint">&mdash; ' + esc(n.source) + ', page ' + n.pages.join(', ') + '</span></td>' +
    '<td colspan="2" class="num mut">not a line</td>' +
    '<td class="num mono">' + amt(n.value, ccy()) +
    '<div><button class="btn" style="margin-top:5px;padding:3px 8px;font-size:11.5px">Add the line</button></div>' +
    '</td></tr>'
  ).join('');

  return '<table><thead><tr><th>#</th><th>Label</th><th>Item</th>' +
    '<th class="num">Qty</th><th class="num">Rate</th><th class="num">Amount</th></tr></thead>' +
    '<tbody>' + rows + notread + '</tbody></table>';
}

function findings(){
  const f = inv().reconcile.findings || [];
  if (!f.length) return '';
  return '<div class="card"><div class="cardhead"><span class="cardtitle">What does not add up</span>' +
    '<span class="pill mute">' + f.length + '</span></div><div class="cardbody">' +
    f.map((x) =>
      '<div class="finding ' + esc(x.severity) + '">' +
      '<div class="meta"><span class="pill ' + (x.severity === 'error' ? 'bad' : x.severity === 'note' ? 'mute' : 'warn') + '">' +
        esc(x.kind) + '</span>' +
        (x.money_at_stake ? ' &nbsp;' + amt(x.money_at_stake, ccy()) + ' at stake' : '') +
        (x.pages && x.pages.length ? ' &nbsp;&middot;&nbsp; page ' + x.pages.join(', ') : '') + '</div>' +
      '<p class="headline">' + esc(x.headline) + '</p>' +
      (x.remedy ? '<p class="remedy">&rarr; ' + esc(x.remedy) + '</p>' : '') +
      '</div>'
    ).join('') + '</div></div>';
}

function totalsSection(){
  const iv = inv(), h = iv.header, r = iv.reconcile;
  const row = (k, v, cls) => v === undefined || v === null ? '' :
    '<div class="k ' + (cls || '') + '">' + k + '</div><div class="v mono ' + (cls || '') + '">' + amt(v, ccy()) + '</div>';
  const tax = iv.tax_components.length
    ? '<table><thead><tr><th>Label</th><th class="num">Rate</th><th class="num">Amount</th></tr></thead><tbody>' +
      iv.tax_components.map((t) =>
        '<tr><td><strong>' + esc(t.label) + '</strong></td>' +
        '<td class="num mono">' + (t.rate === null
            ? '<span class="mut" title="A tax CODE, not a percentage — inventing a rate here is a wrong return">not a rate</span>'
            : esc(t.rate) + '%') + '</td>' +
        '<td class="num mono">' + amt(t.amount, ccy()) + '</td></tr>').join('') +
      '</tbody></table>'
    : '<p class="hint">This invoice prints no tax component. An empty tax block is a correct answer.</p>';

  return '<div class="card"><div class="cardhead"><span class="cardtitle">Printed totals</span>' +
      '<span class="pill ' + (r.reconciles ? 'ok' : 'bad') + '">' +
      (r.reconciles ? 'Adds up' : 'Out by ' + r.residual) + '</span></div>' +
    '<div class="cardbody"><div class="ladder">' +
      row('Subtotal', h.subtotal_printed) + row('Tax total', h.tax_total_printed) +
      '<div class="rule"></div>' + row('Grand total', h.grand_total_printed, 'total') +
      row('Amount due', h.amount_due_printed) +
    '</div></div></div>' +
    '<div class="card"><div class="cardhead"><span class="cardtitle">Tax, as printed</span>' +
      '<span class="hint">rows, not columns</span></div><div class="cardbody">' + tax + '</div></div>' +
    '<div class="card"><div class="cardhead"><span class="cardtitle">The two identities</span>' +
      '<span class="hint">reported whether they hold or not</span></div><div class="cardbody">' +
      (r.identities.length ? r.identities.map((i) =>
        '<div class="identity"><span class="pill ' + (i.holds ? 'ok' : 'bad') + '">' +
        (i.holds ? 'holds' : 'fails') + '</span><div><div class="mono hint">' + esc(i.name) +
        ': ' + esc(i.left) + ' vs ' + esc(i.right) + '</div>' + esc(i.sentence) + '</div></div>'
      ).join('') : '<p class="hint">Nothing was read, so neither identity was tested.</p>') +
    '</div></div>';
}

function activitySection(){
  const mine = run.activity.filter((a) => a.invoice_key === inv().invoice_key);
  return '<div class="card"><div class="cardhead"><span class="cardtitle">Activity</span>' +
    '<span class="hint">append-only</span></div><div class="cardbody">' +
    (mine.length ? mine.map((a) =>
      '<div class="evt"><div>' + esc(a.sentence) + '</div>' +
      '<div class="who mono">' + esc(a.kind) + ' &middot; ' + esc(a.at) + '</div></div>').join('')
      : '<p class="hint">Nothing has been changed on this invoice yet.</p>') +
    '<p class="hint" style="margin-top:9px">A correction that is itself corrected leaves both entries. ' +
    'The log is not a picture of the current state &mdash; it is the record of how it came about.</p>' +
    '</div></div>';
}

function derivedSection(){
  return '<div class="card"><div class="cardbody">' +
    '<span class="pill mute">Not built yet</span>' +
    '<p class="headline">Calculated values &mdash; currency conversion, TDS, place of supply, account coding &mdash; ' +
    'arrive with the later inference feature.</p>' +
    '<p class="hint">They will live in their own table, so <em>where a value lives</em> answers whether it was ' +
    'read off the page or computed. Of the 98 export columns, 42 are read and populated today; the other 56 ' +
    'are written deliberately empty.</p></div></div>';
}

function renderPane(){
  const iv = inv();
  let body = '';
  if (section === 'lines'){
    body = findings() +
      '<div class="card"><div class="cardhead"><span class="cardtitle">Lines, as printed</span>' +
      '<span class="hint">' + iv.reconcile.census.transcribed + ' transcribed &middot; ' +
      iv.reconcile.census.presented + ' presented &middot; ' + iv.reconcile.census.charge_lines +
      ' charge' + (iv.reconcile.census.holds ? '' : ' &mdash; does not balance') + '</span></div>' +
      (iv.read_failed ? linesTable() : linesTable()) + '</div>';
  } else if (section === 'totals'){ body = findings() + totalsSection(); }
  else if (section === 'activity'){ body = activitySection(); }
  else { body = derivedSection(); }
  $('pane').innerHTML = body;
}

function renderAside(){
  const iv = inv();
  const pages = iv.page_ranges.flatMap(([a, b]) => { const o = []; for (let p = a; p <= b; p++) o.push(p); return o; });
  const strip = Array.from({ length: run.page_census.page_count }, (_, i) => i + 1).map((p) => {
    const own = pages.includes(p);
    return '<div class="pagethumb' + (own ? ' on' : ' att') + '" title="' +
      (own ? 'This invoice' : 'Another invoice, or an attachment') + '">' + p + '</div>';
  }).join('');

  const verdicts = iv.verdicts.map((v) =>
    '<div class="evt"><div><span class="pill ' +
      (v.outcome === 'passed' ? 'ok' : v.outcome === 'failed' ? 'bad' : 'mute') + '">' +
      esc(v.outcome.replace(/_/g, ' ')) + '</span> <strong>' + esc(v.check.replace(/_/g, ' ')) + '</strong></div>' +
    '<div class="who">' + esc(v.sentence) + '</div></div>').join('');

  const note = reaskOpen ? reaskPanel() : '';

  const gates = (iv.auto_verify.gates || []).length
    ? '<div class="asidehead">Could this skip review?</div>' +
      iv.auto_verify.gates.map((g) =>
        '<div class="evt"><div><span class="pill ' +
        (g.passed && g.evaluated ? 'ok' : g.evaluated ? 'bad' : 'mute') + '">' +
        (g.passed && g.evaluated ? 'passed' : g.evaluated ? 'failed' : 'not evaluated') + '</span> ' +
        esc(g.name.replace(/_/g, ' ')) + '</div><div class="who">' + esc(g.sentence) + '</div></div>').join('') +
      '<p class="hint">' + esc(iv.auto_verify.sentence) + '</p>'
    : '';

  $('aside').innerHTML =
    '<div class="asidehead">Pages</div>' +
    '<div class="pagestrip">' + strip + '</div>' +
    '<div class="pagesheet">The shipped screen renders the real PDF here.<br />' +
      '<span class="hint">A mock limitation, not the design.</span></div>' +
    '<p class="hint">' + esc(iv.basis) + (iv.copy_count > 1
      ? ' &mdash; printed ' + iv.copy_count + ' times, and both ranges are kept so either printing can be checked.'
      : '') + '</p>' +
    '<div class="asidehead">Checked independently</div>' + (verdicts || '<p class="hint">No second reading.</p>') +
    gates +
    '<div class="asidehead">Re-ask the model</div>' + (note ||
      '<p class="hint">Ask for chosen pages to be read again, with a note about where to look. ' +
      'The note is checked before anything is read.</p>');
}

function reaskPanel(){
  const f = (inv().reconcile.findings || []).find((x) => x.suggested_note);
  const suggested = f ? f.suggested_note : null;
  return '<div>' +
    (suggested ? '<p class="hint">Suggested because ' + esc(suggested.because) + '.</p>' : '') +
    '<textarea class="note" id="noteBox">' + esc(suggested ? suggested.text : '') + '</textarea>' +
    '<p class="hint">Pages ' + inv().page_ranges.map(([a, b]) => a === b ? a : a + '–' + b).join(', ') +
      ' &mdash; from your selection, never from the note.</p>' +
    (refusal ? '<div class="refusal"><div class="rule">Refused &middot; ' + esc(refusal.rule) + '</div>' +
      esc(refusal.detail) + '<p class="hint" style="color:inherit;margin-top:5px">' +
      'Your note is still here, unchanged. It was refused, not stripped.</p></div>' : '') +
    '<div style="display:flex;gap:7px;margin-top:9px">' +
      '<button class="btn primary" id="btnSend">Send</button>' +
      '<button class="btn" id="btnTryFigure">Try one that names a figure</button>' +
    '</div></div>';
}

function renderAll(){
  renderHeader(); renderChips(); renderRail(); renderPane(); renderAside();
  const box = $('btnSend');
  if (box){
    box.onclick = () => { refusal = null; reaskOpen = false; renderAll(); };
    $('btnTryFigure').onclick = () => { refusal = REFUSALS.no_figure; renderAll(); };
  }
}

$('btnReask').onclick = () => { reaskOpen = !reaskOpen; refusal = null; renderAll(); };
$('btnAccept').onclick = () => {
  const iv = inv();
  if (iv.decision === 'accepted') return;
  if (iv.decision === 'undecided') run.undecided_count -= 1;
  if (iv.decision === 'excluded') run.excluded_count -= 1;
  iv.decision = 'accepted'; run.accepted_count += 1;
  run.can_finish = run.undecided_count === 0;
  run.applied_changes += 1;
  run.activity.push({ ordinal: run.activity.length + 1, kind:'invoice_accepted',
    at:'2026-09-11T09:20:00Z', actor:{ id:'u1', display_name:'priya@theatlas.ai' },
    invoice_key: iv.invoice_key, sentence:'priya@theatlas.ai accepted this invoice.', detail:{} });
  renderAll();
};
$('btnExclude').onclick = () => {
  const iv = inv();
  /* A reason is required to exclude and not to accept. Excluding is the one that has to be
     explicable later; asking for a reason to accept trains people to type "ok". */
  const reason = prompt('Excluding an invoice needs a reason.\n\nIt is the field somebody reads when they ask why this bill was never paid, and a blank one answers nothing.');
  if (!reason || !reason.trim()) return;
  if (iv.decision === 'undecided') run.undecided_count -= 1;
  if (iv.decision === 'accepted') run.accepted_count -= 1;
  iv.decision = 'excluded'; iv.excluded_reason = reason.trim(); run.excluded_count += 1;
  run.can_finish = run.undecided_count === 0;
  run.applied_changes += 1;
  run.activity.push({ ordinal: run.activity.length + 1, kind:'invoice_excluded',
    at:'2026-09-11T09:21:00Z', actor:{ id:'u1', display_name:'priya@theatlas.ai' },
    invoice_key: iv.invoice_key,
    sentence:'priya@theatlas.ai excluded this invoice: ' + reason.trim() + '.', detail:{ reason } });
  renderAll();
};
$('btnPrev').onclick = () => { current = (current - 1 + run.invoices.length) % run.invoices.length; reaskOpen = false; renderAll(); };
$('btnNext').onclick = () => { current = (current + 1) % run.invoices.length; reaskOpen = false; renderAll(); };
$('btnFinish').onclick = () => { if (run.can_finish) alert('Review finished. Each invoice is recorded as it was decided — accepted ones with their lines and tax, excluded ones with their reason.'); };

renderAll();
</script>
</body>
</html>
